name: Pre-release

# Lightweight intermediary release, cut straight from the staging branch.
#
# What it does:
#   1. Reads staging's current version (e.g. 3.3.0-dev.12) — no bump, no stamp,
#      no merge, no commits. Branches are left completely untouched.
#   2. Tags staging's HEAD with that version (v3.3.0-dev.12) and pushes the tag.
#   3. Builds chippy.zip with the packager.
#   4. Publishes a GitHub *pre-release* with the zips attached. Pre-releases
#      never become "latest", so releases/latest/download/... keeps serving
#      the last stable release.
#
# Trigger: Actions tab → "Pre-release" → Run workflow.

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  STAGING_BRANCH: staging

jobs:
  prerelease:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staging
        uses: actions/checkout@v5
        with:
          ref: staging
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Read current staging version
        id: ver
        run: |
          set -euo pipefail
          VERSION="$(node scripts/stamp-version.mjs --check)"
          echo "Staging version: $VERSION  (tag v$VERSION)"
          {
            echo "version=$VERSION"
            echo "tag=v$VERSION"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if the tag already exists
        run: |
          TAG="${{ steps.ver.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "::error::Tag $TAG already exists — this staging version was already pre-released. Commit something (the dev version changes) or delete the tag."
            exit 1
          fi

      - name: Tag staging HEAD and push the tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Chippy ${{ steps.ver.outputs.tag }} (pre-release)"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Build chippy.zip
        run: node scripts/build-package.mjs --versioned

      - name: Publish GitHub pre-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--title "Chippy ${{ steps.ver.outputs.tag }}" --prerelease)
          # Use the changelog entry for this dev version if one exists,
          # otherwise fall back to GitHub's auto-generated notes.
          if node scripts/release-notes.mjs "${{ steps.ver.outputs.version }}" release-notes.md; then
            ARGS+=(--notes-file release-notes.md)
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            dist/chippy.zip \
            "dist/chippy-${{ steps.ver.outputs.version }}.zip" \
            "${ARGS[@]}"

      - name: Upload build artifact (always, for inspection)
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: chippy-zip-prerelease
          path: dist/*.zip
          if-no-files-found: ignore
