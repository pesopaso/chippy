name: Release

# Manual release pipeline: staging → main, minor bump, tag, GitHub Release,
# then bump staging to the next dev version.
#
# What it does, in order:
#   1. Reads the current release version from main (src/local/main.js) and
#      computes the next one: minor + 1, patch reset to 0 (3.1.0 → 3.2.0).
#      An explicit `version` input overrides the computed one.
#   2. Merges staging into main (--no-ff). Conflicts fail the run; nothing is pushed.
#   3. Stamps the release version into main.js + app.html (scripts/stamp-version.mjs),
#      commits "Release vX.Y.0", tags vX.Y.0, pushes main + tag.
#   4. Builds chippy.zip and publishes a GitHub Release. The body is the
#      documentation/changelog.md entry for the version if one exists, otherwise
#      GitHub's auto-generated notes.
#   5. Merges main back into staging (so staging contains the release commit),
#      stamps staging with the next dev version (X.(Y+1).0-dev.1) and pushes.
#
# Trigger: Actions tab → "Release" → Run workflow. The branch you pick in the
# dialog does not matter — the job always works on origin/main and origin/staging.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override the release version (semver without v, e.g. 3.2.0). Leave empty for main's version + 0.1."
        required: false
        type: string
        default: ""
      prerelease:
        description: "Mark the GitHub Release as a pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_BRANCH: main
  STAGING_BRANCH: staging

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository (all branches and tags)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute release and next dev version
        id: ver
        run: |
          set -euo pipefail
          git checkout -q "$RELEASE_BRANCH"
          CURRENT="$(node scripts/stamp-version.mjs --check)"
          CURRENT="${CURRENT%%-*}"            # drop any -dev/-rc suffix
          IFS=. read -r MAJ MIN _PATCH <<< "$CURRENT"

          OVERRIDE="${{ inputs.version }}"
          OVERRIDE="${OVERRIDE#v}"
          if [ -n "$OVERRIDE" ]; then
            if ! echo "$OVERRIDE" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::Invalid version override '$OVERRIDE' (expected X.Y.Z)"
              exit 1
            fi
            RELEASE="$OVERRIDE"
          else
            RELEASE="$MAJ.$((MIN + 1)).0"
          fi

          IFS=. read -r RMAJ RMIN _ <<< "$RELEASE"
          NEXT_DEV="$RMAJ.$((RMIN + 1)).0-dev.1"

          echo "Current version on $RELEASE_BRANCH : $CURRENT"
          echo "Release version                     : $RELEASE  (tag v$RELEASE)"
          echo "Next $STAGING_BRANCH version        : $NEXT_DEV"

          {
            echo "current=$CURRENT"
            echo "version=$RELEASE"
            echo "tag=v$RELEASE"
            echo "next_dev=$NEXT_DEV"
          } >> "$GITHUB_OUTPUT"

      - name: Fail if the tag already exists
        run: |
          for T in "${{ steps.ver.outputs.tag }}" "${{ steps.ver.outputs.version }}"; do
            if git rev-parse -q --verify "refs/tags/$T" >/dev/null; then
              echo "::error::Tag $T already exists. Use the version override or delete the tag."
              exit 1
            fi
          done

      - name: Merge staging into main
        run: |
          set -euo pipefail
          git checkout -q "$RELEASE_BRANCH"
          if git merge-base --is-ancestor "origin/$STAGING_BRANCH" HEAD; then
            echo "::warning::$STAGING_BRANCH has no new commits relative to $RELEASE_BRANCH; releasing current $RELEASE_BRANCH."
          else
            if ! git merge --no-ff --no-edit "origin/$STAGING_BRANCH" \
                 -m "Merge $STAGING_BRANCH into $RELEASE_BRANCH for release ${{ steps.ver.outputs.tag }}"; then
              # The version-stamped files (main.js, app.html) conflict on every release,
              # because main holds the last release stamp and staging the -dev stamp.
              # They are re-stamped in the next step, so take staging's side for those.
              # Any other conflicting file is a real conflict and aborts the run.
              CONFLICTS="$(git diff --name-only --diff-filter=U)"
              OTHER="$(echo "$CONFLICTS" | grep -vE '^src/local/(main\.js|app\.html)$' || true)"
              if [ -n "$OTHER" ]; then
                echo "::error::Merge conflict between $STAGING_BRANCH and $RELEASE_BRANCH in: $(echo $OTHER). Resolve locally and re-run."
                exit 1
              fi
              echo "Resolving version-stamp conflicts using $STAGING_BRANCH: $(echo $CONFLICTS)"
              echo "$CONFLICTS" | xargs git checkout --theirs --
              echo "$CONFLICTS" | xargs git add --
              git commit --no-edit
            fi
          fi

      - name: Stamp release version into main
        run: |
          node scripts/stamp-version.mjs "${{ steps.ver.outputs.version }}"
          node scripts/stamp-version.mjs --check

      - name: Prepare release notes
        id: notes
        run: |
          if node scripts/release-notes.mjs "${{ steps.ver.outputs.version }}" release-notes.md; then
            echo "source=changelog" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No '### v${{ steps.ver.outputs.version }}' entry in documentation/changelog.md — using GitHub auto-generated notes."
            echo "source=generated" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit, tag and push main
        run: |
          set -euo pipefail
          git add src/local/main.js src/local/app.html
          if ! git diff --cached --quiet; then
            git commit -m "Release ${{ steps.ver.outputs.tag }}"
          fi
          git tag -a "${{ steps.ver.outputs.tag }}" -m "Chippy ${{ steps.ver.outputs.tag }}"
          git push origin "$RELEASE_BRANCH"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: Build chippy.zip
        run: node scripts/build-package.mjs --versioned

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          ARGS=(--title "Chippy ${{ steps.ver.outputs.tag }}")
          if [ "${{ steps.notes.outputs.source }}" = "changelog" ]; then
            ARGS+=(--notes-file release-notes.md)
          else
            ARGS+=(--generate-notes)
          fi
          if [ "${{ inputs.prerelease }}" = "true" ]; then ARGS+=(--prerelease); fi
          gh release create "${{ steps.ver.outputs.tag }}" \
            dist/chippy.zip \
            "dist/chippy-${{ steps.ver.outputs.version }}.zip" \
            "${ARGS[@]}"

      - name: Bump staging to the next dev version
        run: |
          set -euo pipefail
          git checkout -q -B "$STAGING_BRANCH" "origin/$STAGING_BRANCH"
          # Bring the release commit back so staging never diverges from main.
          git merge --no-ff --no-edit "$RELEASE_BRANCH" \
            -m "Merge $RELEASE_BRANCH (${{ steps.ver.outputs.tag }}) back into $STAGING_BRANCH" \
            || { echo "::error::Could not merge $RELEASE_BRANCH back into $STAGING_BRANCH (release was published; fix $STAGING_BRANCH manually)."; exit 1; }
          node scripts/stamp-version.mjs "${{ steps.ver.outputs.next_dev }}"
          node scripts/stamp-version.mjs --check
          git add src/local/main.js src/local/app.html
          if ! git diff --cached --quiet; then
            git commit -m "Bump $STAGING_BRANCH to ${{ steps.ver.outputs.next_dev }}"
          fi
          git push origin "$STAGING_BRANCH"

      - name: Upload build artifact (always, for inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chippy-zip
          path: dist/*.zip
          if-no-files-found: ignore
